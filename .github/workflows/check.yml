name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra relay --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check machine_control tests extensions/project_picker
      - run: uv run ruff format --check machine_control tests extensions/project_picker
      - run: uv run pyright machine_control
